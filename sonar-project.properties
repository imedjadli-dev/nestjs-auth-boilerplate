sonar.projectKey=nestjs-auth
sonar.projectName=NestJS Auth Boilerplate

sonar.sources=src
sonar.tests=src

sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=node_modules/**, dist/**, generated/**, coverage/**
sonar.coverage.exclusions=\
  src/main.ts,\
  src/**/*.module.ts,\
  src/**/*.dto.ts,\
  src/**/*.entity.ts,\
  src/**/*.interface.ts,\
  src/**/*.strategy.ts,\
  src/**/*.guard.ts,\
  src/**/*.decorator.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info